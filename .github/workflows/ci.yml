name: Node.js CI (Lint & Test)

on:
  push:
    branches: [ "main", "Prototipo", "feature/*" ]
  pull_request:
    branches: [ "main", "Prototipo" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Instalar dependencias
      run: npm ci

    - name: Correr Linter (ESLint)
      run: npm run lint

    - name: Correr Pruebas (Vitest)
      run: npm run test