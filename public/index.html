<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sierra Madre Check-In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: '#1e3a8a' } } }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300 min-h-screen flex">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-brand dark:bg-gray-800 text-white flex flex-col shadow-lg">
        <div class="p-6 text-center border-b border-blue-800 dark:border-gray-700">
            <h1 class="text-xl font-bold">Sierra Madre</h1>
            <p class="text-xs text-blue-200 mt-1">Resort & Casino</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button data-tab="checkin" class="tab-btn w-full text-left px-4 py-2 rounded bg-blue-800 font-medium">Check-in</button>
            <button data-tab="cabins" class="tab-btn w-full text-left px-4 py-2 rounded hover:bg-blue-800 transition">Cabinas</button>
            <button data-tab="status" class="tab-btn w-full text-left px-4 py-2 rounded hover:bg-blue-800 transition">Estado del Sistema</button>
        </nav>
        <div class="p-4 border-t border-blue-800 dark:border-gray-700">
            <button id="themeToggle" class="w-full bg-gray-700 hover:bg-gray-600 text-white py-2 rounded text-sm transition">
                Cambiar Tema
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- HEADER -->
        <header class="bg-white dark:bg-gray-800 shadow-sm p-4 flex justify-between items-center">
            <h2 class="text-2xl font-semibold" id="pageTitle">Check-in de Pasajeros</h2>
            <div class="text-sm text-gray-500 dark:text-gray-400">Recepción</div>
        </header>

        <!-- TABS CONTENT -->
        <div class="flex-1 overflow-y-auto p-6">
            
            <!-- Tab: Check-in (FORMULARIO RESTAURADO) -->
            <section id="tab-checkin" class="tab-content">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow max-w-2xl">
                    <form id="checkinForm">
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-1">Código de Reserva</label>
                            <input type="text" id="groupCode" required class="w-full border p-2 rounded dark:bg-gray-700 dark:border-gray-600" placeholder="Ej. FAM-999">
                        </div>
                        
                        <h3 class="font-semibold mb-2">Pasajeros</h3>
                        <div id="passengersContainer" class="space-y-3 mb-4"></div>
                        
                        <button type="button" id="addPassengerBtn" class="text-sm text-blue-600 dark:text-blue-400 mb-6 hover:underline font-medium">+ Agregar otro pasajero</button>
                        
                        <button type="submit" class="w-full bg-brand text-white p-2 rounded hover:bg-blue-800 transition font-bold">Iniciar Check-in</button>
                    </form>
                    
                    <div id="messageContainer" class="mt-4 hidden p-4 rounded border"></div>
                </div>
            </section>

            <!-- Tab: Cabins -->
            <section id="tab-cabins" class="tab-content hidden">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
                    <h3 class="text-xl font-bold mb-4">Mapa de Cabinas</h3>
                    <p class="text-sm text-gray-500 mb-6">Haz clic en una cabina verde para seleccionarla.</p>
                    <div id="cabinsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
                </div>
            </section>

            <!-- Tab: Status -->
            <section id="tab-status" class="tab-content hidden">
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
                    <p>Estado del servidor y conexiones.</p>
                </div>
            </section>

        </div>
    </main>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
